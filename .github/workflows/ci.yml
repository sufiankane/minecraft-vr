name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-windows:
    name: cpp-windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef

      - name: Bootstrap vcpkg
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Cache vcpkg installed tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp/build/windows-msvc/vcpkg_installed
          key: vcpkg-installed-windows-eb2d3a3279fd019cb7733072d86900d0ad2a1aef-${{ hashFiles('cpp/vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-windows-eb2d3a3279fd019cb7733072d86900d0ad2a1aef-

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Cache LLVM 23.1.2 (clang-format/clang-tidy)
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # TD-037: the pinned tools come from the official LLVM release
          # archive, never from the runner image. The key embeds the archive
          # SHA-256 prefix so a deliberate pin bump naturally misses it.
          path: ${{ runner.tool_cache }}/llvm-23.1.2
          key: llvm-23.1.2-win64-8fb91cdc44fc

      - name: Install LLVM 23.1.2 (clang-format/clang-tidy)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        # TD-037: install the documented LLVM instead of asserting against
        # whatever the image ships (windows-latest moved to clang-format
        # 20.1.8 while the repo pins 23.1.2). Source archive and SHA-256:
        #   https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz
        #   sha256 8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095
        # The hash is sigstore-attested in the release's .jsonl sidecar and
        # was recomputed from the downloaded asset; a mismatch fails here
        # before extraction. Bumping the pin is one deliberate edit here
        # (version, URL and hash, plus the cache key above and
        # docs/toolchains.md).
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz'
          $expected = '8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095'
          $archive = Join-Path $env:RUNNER_TEMP 'clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.xz'
          $dest = Join-Path $env:RUNNER_TOOL_CACHE 'llvm-23.1.2'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "LLVM archive SHA-256 mismatch for $url (expected $expected, got $actual). The release asset changed; review it and update the pin in .github/workflows/ci.yml (and docs/toolchains.md) deliberately."
          }
          Write-Host "Verified SHA-256 $actual for the pinned LLVM 23.1.2 archive."
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          # Only the two statically linked tools are needed; the full bin
          # tree is 3.4 GB and neither tool needs the release DLLs
          # (smoke-tested against the 23.1.2 archive).
          tar -xf $archive -C $dest 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin/clang-format.exe' 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin/clang-tidy.exe'
          $bin = Join-Path $dest 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin'
          foreach ($tool in @('clang-format.exe', 'clang-tidy.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $tool))) {
              throw "$tool was not extracted under $bin; the pinned archive layout changed."
            }
          }

      - name: Toolchain versions (pinned clang assertions)
        # TD-037: the format/tidy gates must run the documented LLVM 23.1.2,
        # installed from the SHA-256-pinned archive above, not the image's
        # clang. Fail with an actionable message before any source is checked.
        run: |
          $bin = Join-Path $env:RUNNER_TOOL_CACHE 'llvm-23.1.2/clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin'
          if (-not (Test-Path -LiteralPath $bin)) {
            throw "The pinned LLVM 23.1.2 tools are missing from $bin; the install step or its cache restore failed."
          }
          $env:PATH = "$bin;$env:PATH"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $expected = '23.1.2'
          cmake --version
          ninja --version
          foreach ($tool in @('clang-format', 'clang-tidy')) {
            $resolved = (Get-Command $tool -ErrorAction SilentlyContinue).Source
            if (-not $resolved) {
              throw "$tool was not found on PATH after installing the pinned LLVM 23.1.2 (TD-037)."
            }
            $output = (& $tool --version | Out-String).Trim()
            Write-Host "${tool}: $resolved"
            Write-Host $output
            if (-not $resolved.StartsWith($bin, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "$tool resolved to $resolved, not the pinned LLVM 23.1.2 under $bin; the runner image's clang must not satisfy the format/tidy gates (TD-037)."
            }
            if ($output -notmatch [regex]::Escape($expected)) {
              throw "$tool is not LLVM $expected. clang-tidy prints its version on the second line, so the whole output is checked here; bump the pin in .github/workflows/ci.yml and docs/toolchains.md together (TD-037)."
            }
          }

      - name: Configure
        run: cmake --preset windows-msvc
        working-directory: cpp

      - name: Build
        run: cmake --build --preset windows-msvc
        working-directory: cpp

      - name: Test
        run: ctest --preset ci
        working-directory: cpp

      # CXX-03: the Debug lane above is the required ctest gate; this Release
      # (NDEBUG) mirror runs the same tests through the release code paths. It
      # reuses the same job so the six required check names stay unchanged.
      - name: Configure (Release lane)
        run: cmake --preset windows-release
        working-directory: cpp

      - name: Build (Release lane)
        run: cmake --build --preset windows-release
        working-directory: cpp

      - name: Test (Release lane)
        run: ctest --preset windows-release --output-on-failure
        working-directory: cpp

      - name: clang-format (warnings as errors)
        run: |
          $version = (& clang-format --version | Out-String).Trim()
          if ($version -notmatch '23\.1\.2') {
            throw "clang-format is not the pinned LLVM 23.1.2 (got: $version); the pinned install step must have run first (TD-037)."
          }
          # Every C++ source and header under cpp/. contracts/ is deliberately
          # excluded: those headers are dossier-verbatim.
          $files = @(git ls-files cpp | Where-Object { $_ -match '\.(cpp|hpp|h|hh|cc|cxx)$' })
          if ($files.Count -eq 0) {
            throw "clang-format selector found no C++ files under cpp/; the format gate would pass vacuously (TD-063)."
          }
          clang-format --dry-run --Werror $files

      - name: clang-tidy (native modules core-math, glasses, bridge)
        # TD-029: the gate runs the pinned LLVM 23.1.2 over every native module
        # source, matching the documented local invocation in docs/ci.md
        # ("Reproduce locally"). The --header-filter narrows the repository
        # header regex to the three module directories: .clang-tidy's default
        # (^|[/\\])cpp[/\\]... also matches the frozen, dossier-verbatim
        # headers under contracts/ once glasses and bridge include them.
        working-directory: cpp
        run: |
          $version = (& clang-tidy --version | Out-String).Trim()
          if ($version -notmatch '23\.1\.2') {
            throw "clang-tidy is not the pinned LLVM 23.1.2 (got: $version); the pinned install step must have run first (TD-037)."
          }
          $headerFilter = '[\\/](core-math|glasses|bridge)[\\/](include|src)[\\/].*\.(h|hpp)$'
          $files = @(git ls-files core-math/src glasses/src bridge/src | Where-Object { $_ -match '\.cpp$' })
          if ($files.Count -eq 0) {
            throw "clang-tidy selector found no native module sources; the tidy gate would pass vacuously (TD-063)."
          }
          clang-tidy "--header-filter=$headerFilter" -p build/windows-msvc $files

  cpp-linux-asan:
    name: cpp-linux-asan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install pinned LLVM 23.1.2 (clang-format/clang-tidy)
        # TD-037: no image LLVM. The 23.1.2 release publishes only the 2 GB
        # all-tools Linux bundle, so install just the two tools from
        # apt.llvm.org with the exact version pinned; the assertion below
        # fails loudly if the pool stops serving that exact build. Both
        # .debs are published with SHA-256 in the signed index at
        # https://apt.llvm.org/noble/dists/llvm-toolchain-noble-23/main/binary-amd64/Packages
        # (the runner image is ubuntu-24.04/noble):
        #   clang-format-23 94b39c8c9bb7ad59388591bf6560c86c0b48478643245229b69884468c6d2a74
        #   clang-tidy-23   767ea250128c55d51e5e3a8b295e8c72865904cee1a5adc379276cea6d832319
        run: |
          set -euo pipefail
          version='1:23.1.2~++20260919103626+4b1925210476-1~exp1~20260919223755.77'
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list > /dev/null
          sudo apt-get update
          for package in clang-format-23 clang-tidy-23; do
            if ! apt-cache madison "$package" | grep -qF "$version"; then
              echo "::error::$package $version is no longer offered by apt.llvm.org; review the pool and update the pin in .github/workflows/ci.yml (and docs/toolchains.md) deliberately before re-running."
              exit 1
            fi
          done
          sudo apt-get install -y "clang-format-23=$version" "clang-tidy-23=$version"

      - name: Toolchain versions (pinned clang assertions)
        # TD-037: clang-format/clang-tidy must be exactly 23.1.2. clang-tidy
        # prints its version on the second line, so the whole output is matched.
        run: |
          cmake --version
          ninja --version
          for tool in clang-format-23 clang-tidy-23; do
            output=$("$tool" --version)
            echo "$output"
            if ! echo "$output" | grep -q '23\.1\.2'; then
              echo "::error::$tool is not the pinned LLVM 23.1.2; bump the exact version in .github/workflows/ci.yml and docs/toolchains.md together (TD-037)."
              exit 1
            fi
          done

      - name: Clone and bootstrap vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset linux-asan
        working-directory: cpp

      - name: Build
        run: cmake --build --preset linux-asan
        working-directory: cpp

      - name: Test
        # Task 2 binds the "ci" test preset to configurePreset "windows-msvc",
        # so the linux-asan build tree is driven by the linux-asan test preset.
        run: ctest --preset linux-asan
        working-directory: cpp

      - name: Lower ASLR entropy for TSan
        # GCC's TSan runtime cannot map its shadow memory when vm.mmap_rnd_bits
        # is 32, the Ubuntu runner default; 28 is the documented value. The
        # reduction is best-effort: the key is absent on some kernels and
        # hosted images have denied the write even under sudo (PR #58). When
        # it is applied, the previous value is captured so the reduction is
        # job-scoped and a later step restores it even when the TSan test
        # fails (TD-066). TSan itself still runs for real below.
        run: |
          current=$(sysctl -n vm.mmap_rnd_bits 2>/dev/null || true)
          if [ -z "$current" ]; then
            echo "::warning::vm.mmap_rnd_bits is not readable on this kernel; TSan will run at the image default ASLR entropy."
            exit 0
          fi
          echo "vm.mmap_rnd_bits is currently $current."
          if [ "$current" = "28" ]; then
            echo "ASLR entropy is already 28 (the documented TSan value); nothing to lower."
            exit 0
          fi
          if sudo -n sysctl vm.mmap_rnd_bits=28; then
            echo "CG_MMAP_RND_BITS_BEFORE=$current" >> "$GITHUB_ENV"
            echo "Lowered vm.mmap_rnd_bits from $current to 28 for TSan; it will be restored at job end."
          else
            echo "::warning::Could not lower vm.mmap_rnd_bits from $current to 28 (sudo denied or unavailable); TSan will run at the image default ASLR entropy. The runner is ephemeral, so there is nothing to restore."
          fi

      - name: Configure (TSan)
        run: cmake --preset linux-tsan
        working-directory: cpp

      - name: Build (TSan)
        run: cmake --build --preset linux-tsan
        working-directory: cpp

      - name: Test (TSan)
        run: ctest --preset linux-tsan --output-on-failure
        working-directory: cpp

      - name: Restore ASLR entropy
        # TD-066: the reduced-ASLR window is job-scoped. `if: always()` also
        # restores when the TSan test failed or was cancelled midway. A denied
        # restore only warns: the runner is ephemeral, so the exposure ends
        # with the job and cleanup must not mask the TSan gate.
        if: always()
        run: |
          if [ -z "${CG_MMAP_RND_BITS_BEFORE:-}" ]; then
            echo "ASLR entropy was not lowered in this job; nothing to restore."
            exit 0
          fi
          if sudo -n sysctl "vm.mmap_rnd_bits=${CG_MMAP_RND_BITS_BEFORE}"; then
            echo "Restored vm.mmap_rnd_bits to ${CG_MMAP_RND_BITS_BEFORE}."
          else
            echo "::warning::Could not restore vm.mmap_rnd_bits to ${CG_MMAP_RND_BITS_BEFORE} (sudo denied or unavailable); the reduced-ASLR window ends with this ephemeral runner."
          fi

      # CXX-03: the sanitizer lanes above run Debug builds; this Release
      # (NDEBUG, no sanitizers) lane exercises the shipped code paths. It stays
      # inside this job so the six required check names stay unchanged.
      - name: Configure (Release lane)
        run: cmake --preset linux-ci
        working-directory: cpp

      - name: Build (Release lane)
        run: cmake --build --preset linux-ci
        working-directory: cpp

      - name: Test (Release lane)
        run: ctest --preset linux-ci --output-on-failure
        working-directory: cpp

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install coverage tooling
        run: |
          python -m pip install --require-hashes -r python/requirements-ci.txt
          python -m pip install -e python

      - name: Configure (coverage)
        run: cmake --preset linux-coverage
        working-directory: cpp

      - name: Build (coverage)
        run: cmake --build --preset linux-coverage
        working-directory: cpp

      - name: Test (coverage)
        run: ctest --preset linux-coverage
        working-directory: cpp

      - name: Generate Cobertura XML
        run: gcovr --root . --xml --output coverage.cobertura.xml
        working-directory: cpp

      - name: Enforce core-math coverage floor
        run: python -m depcheck coverage --report coverage.cobertura.xml --module core-math --floor 95
        working-directory: cpp

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Toolchain versions
        run: dotnet --version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install coverage tooling
        working-directory: .
        run: python -m pip install -e python

      - name: Build solution
        run: dotnet build Cubeglass.sln --configuration Release

      - name: Test CoreMath with coverage
        run: >-
          dotnet test tests/CoreMath.Tests/Cubeglass.CoreMath.Tests.csproj
          --configuration Release --collect:"XPlat Code Coverage"
          --results-directory ./coverage/coremath

      - name: Test Voxel with coverage
        run: >-
          dotnet test tests/Voxel.Tests/Cubeglass.Voxel.Tests.csproj
          --configuration Release --collect:"XPlat Code Coverage"
          --results-directory ./coverage/voxel

      - name: Test Mesh with coverage
        run: >-
          dotnet test tests/Mesh.Tests/Cubeglass.Mesh.Tests.csproj
          --configuration Release --collect:"XPlat Code Coverage"
          --results-directory ./coverage/mesh

      - name: Test Gameplay with coverage
        run: >-
          dotnet test tests/Gameplay.Tests/Cubeglass.Gameplay.Tests.csproj
          --configuration Release --collect:"XPlat Code Coverage"
          --results-directory ./coverage/gameplay

      - name: Test Streaming with coverage
        run: >-
          dotnet test tests/Streaming.Tests/Cubeglass.Streaming.Tests.csproj
          --configuration Release --collect:"XPlat Code Coverage"
          --results-directory ./coverage/streaming

      - name: Enforce CoreMath coverage floor
        # The report directory contains exactly one coverage.cobertura.xml; the
        # depcheck resolver fails on zero or several candidates instead of
        # silently picking the first (TD-032).
        run: python -m depcheck coverage --report coverage/coremath --module Cubeglass.CoreMath --floor 95

      - name: Enforce Voxel coverage floor
        run: python -m depcheck coverage --report coverage/voxel --module Cubeglass.Voxel --floor 90

      - name: Enforce Mesh coverage floor
        run: python -m depcheck coverage --report coverage/mesh --module Cubeglass.Mesh --floor 90

      - name: Enforce Gameplay coverage floor
        run: python -m depcheck coverage --report coverage/gameplay --module Cubeglass.Gameplay --floor 90

      - name: Enforce Streaming coverage floor
        run: python -m depcheck coverage --report coverage/streaming --module Cubeglass.Streaming --floor 90

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Toolchain versions
        run: python --version

      - name: Install development requirements
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Install the package (editable)
        run: python -m pip install -e .

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy calib depcheck tests

      - name: pytest with coverage
        # Source is the project root so Cobertura filenames keep the module
        # directory (calib/..., depcheck/...); per-directory sources collapse to
        # basenames and collide across packages.
        run: python -m pytest --cov=. --cov-report=xml:coverage.xml

      - name: Enforce calib coverage floor
        run: python -m depcheck coverage --report coverage.xml --module calib --floor 90

      - name: Enforce depcheck coverage floor
        run: python -m depcheck coverage --report coverage.xml --module depcheck --floor 90

  depcheck:
    name: depcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `git merge-base origin/<base> HEAD` exists for the
          # version-bump check below (TD-049).
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tooling
        run: |
          python -m pip install --require-hashes -r python/requirements-dev.txt
          python -m pip install -e python

      - name: Fetch the pull-request base for the version-bump check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Enforce dependency rules and layers.json completeness
        run: python -m depcheck --root .

      - name: Enforce the contract-compatibility gate
        # TD-049: on a PR the gate also compares against the base branch's
        # merge-base baseline, so editing a contract constant and the baseline
        # without bumping CG_ABI_VERSION is flagged. On push the ref is empty
        # and the local (review-enforced) path runs.
        env:
          CG_CONTRACT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python -m depcheck contracts --root .

      - name: Cross-check the golden transform fixture
        run: python -m depcheck golden --root .

  licences:
    name: licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tooling
        run: |
          python -m pip install --require-hashes -r python/requirements-dev.txt
          python -m pip install -e python

      - name: Enforce licence allowlist
        run: python -m depcheck licences --root .
