name: Release

# Dispatch-only (R49): the v0.1.0 player build is an owner event. The
# `build_target` dispatch input chooses between two build paths:
#
#   hosted (default)  `windows-x64-player` on GitHub-hosted windows-latest.
#                     Needs Unity credentials in one of two modes:
#
#                       - offline licence: UNITY_LICENSE alone, the contents
#                         of a Personal/Student .ulf exported from
#                         license.unity3d.com/manual (no account credentials
#                         required); the release gate writes it
#                         to Unity_lic.ulf and runs
#                         `unity license activate --file`.
#                       - serial: UNITY_SERIAL alone, a Plus/Pro/Education
#                         serial; the release gate runs `unity license
#                         activate --serial` and returns the seat afterwards.
#
#                     Without one of these it fails before any build step with
#                     an actionable message instead of silently skipping the
#                     release artefact.
#
#   self-hosted       `build-self-hosted` on a Windows runner installed on the
#                     machine whose Unity editor is already activated through
#                     the Unity Hub (Unity Personal here). It needs no Unity
#                     secrets: the machine's own Hub activation is the licence,
#                     and the machine already builds the player with
#                     `unity run unity/Cubeglass -- -executeMethod
#                     Cubeglass.Editor.BuildPlayer.BuildWindows64`.
#
# Why the self-hosted path exists: the owner's Unity Personal is
# Hub-activated, and the hosted route needs the licence supplied as secrets.
# A Unity Student/Personal account can export an offline .ulf from
# license.unity3d.com/manual and store it as UNITY_LICENSE (`unity license
# activate --file`); the CLI explicitly rejects `unity license activate
# --personal` when it runs with service-account tokens, so unattended
# Personal/Student activation uses the offline file. `unity license activate
# --serial` needs a Plus/Pro/Education serial and `--floating` needs a
# floating licence server. The licensed machine can still build with no
# secrets at all.
#
# Self-hosted runner setup (one-off, on the licensed machine):
#   1. GitHub: repo -> Settings -> Actions -> Runners -> New self-hosted
#      runner -> Windows. Run config.cmd and add the labels this job selects:
#      `self-hosted` and `windows`.
#   2. Run the runner as the Windows user that activated Unity through the
#      Hub: the Personal licence lives in that user's profile
#      (%LOCALAPPDATA%\Unity\licenses), so a service under a system account
#      cannot see it. Start it with run.cmd, or register the service with that
#      user's account.
#   3. On that user's PATH: the GitHub runner agent, the Unity CLI (`unity`)
#      and Visual Studio Build Tools with the C++ x64 toolset (CMake and Ninja
#      come from its developer shell). The GitHub CLI (`gh`) is needed only for
#      the release attach; without it the job skips the attach with a warning
#      and the player stays available as the workflow artefact. A vcpkg
#      checkout is reused when present (`VCPKG_ROOT` or `%USERPROFILE%\vcpkg`),
#      with its HEAD checked against `cpp/vcpkg.json`'s `builtin-baseline`
#      (a mismatch warns and proceeds) and `vcpkg.exe` bootstrapped when
#      missing; otherwise the job clones the pinned baseline into the runner
#      temp dir.
#   4. The job uses `shell: powershell` (Windows PowerShell 5.1), not `pwsh`:
#      the licensed machine has no PowerShell 7 and every repo script it calls
#      declares `#requires -Version 5.1`.
#
# Tagged releases are test-gated (I-6): on both paths the EditMode and PlayMode
# suites run before the player build and any failure fails the release. The
# hosted path installs the pinned Unity CLI and Editor and activates the
# licence first; the self-hosted path runs the suites with the machine's
# already-licensed editor.
#
# The player compiles the managed Cubeglass plugins and P/Invokes the native
# cg_unity_bridge.dll, so both are built on the runner and staged into the
# Unity project before the player build (the same files scripts/ci-local.ps1
# stages locally). The staged DLLs are git-ignored, so the checkout stays
# clean for the builder. On the hosted path vcpkg is cloned and installs under
# the runner temp dir, never inside the checkout, because the clean checkout is
# the build's precondition
# runs `git status --porcelain` before Unity and an untracked in-workspace
# vcpkg would fail it. The self-hosted path keeps the dependency tree next to
# the machine's vcpkg checkout for the same reason and so it survives between
# runs. Without this staging the Unity compile fails and a player built from a
# clean checkout would ship no head tracking.
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build path: hosted uses the Unity licence secrets; self-hosted uses the Hub-activated Windows runner.'
        type: choice
        options:
          - hosted
          - self-hosted
        default: hosted

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64-player:
    name: windows-x64-player
    # Only one path runs per dispatch: this is the default (`build_target:
    # hosted`), the self-hosted job below is the opt-in.
    if: inputs.build_target == 'hosted'
    runs-on: windows-latest
    timeout-minutes: 180
    # The build runs with the workflow's read-only default token: no step here
    # needs repository write access. The release attach is a separate job with
    # `contents: write` (see attach-hosted), so a compromised build step or the
    # unpinned Unity CDN installer cannot reach a repo-write token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the Unity licence secrets
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          $hasLicense = -not [string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)
          $hasSerial = -not [string]::IsNullOrWhiteSpace($env:UNITY_SERIAL)
          if ($hasLicense) {
            Write-Host 'Unity credentials present: UNITY_LICENSE (offline .ulf mode; no account credentials required).'
            exit 0
          }
          if ($hasSerial) {
            Write-Host 'Unity credentials present: UNITY_SERIAL (serial mode; no account credentials required).'
            exit 0
          }
          $message = "Release build blocked: neither UNITY_LICENSE nor UNITY_SERIAL is set. Set UNITY_LICENSE to the contents of an offline .ulf (Personal/Student, from license.unity3d.com/manual, activated with 'unity license activate --file') or UNITY_SERIAL to a Plus/Pro/Education serial (activated with 'unity license activate --serial') under Settings > Secrets and variables > Actions so the Unity editor can activate and build the Windows x64 player."
          Write-Host "::error::$message"
          exit 1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Build the managed plugins (Release)
        run: dotnet build dotnet/Cubeglass.sln --configuration Release

      - name: Stage the managed plugins into the Unity project
        shell: pwsh
        run: ./scripts/sync-unity-plugins.ps1

      - name: Clone vcpkg at the pinned baseline
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef

      - name: Bootstrap vcpkg
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Cache the vcpkg installed tree (outside the checkout)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-installed
          key: vcpkg-installed-windows-eb2d3a3279fd019cb7733072d86900d0ad2a1aef-${{ hashFiles('cpp/vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-windows-eb2d3a3279fd019cb7733072d86900d0ad2a1aef-

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Release, not the preset's Debug default: the player ships this DLL,
      # and a Debug build links the non-redistributable debug CRT, which
      # would fail to load on a machine without the Visual Studio debug
      # runtimes. cg_bridge is always part of the project (no build switch).
      # VCPKG_INSTALLED_DIR keeps the manifest tree next to the cached path
      # outside the checkout (vcpkg does not read the value from the
      # environment, so it is passed as a cache variable).
      - name: Configure the native bridge (Release)
        working-directory: cpp
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: cmake --preset windows-msvc -DCMAKE_BUILD_TYPE=Release "-DVCPKG_INSTALLED_DIR=${{ runner.temp }}/vcpkg-installed"

      - name: Build the native bridge
        working-directory: cpp
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: cmake --build --preset windows-msvc --target cg_bridge

      - name: Stage the native bridge into the Unity project
        shell: pwsh
        run: |
          $source = 'cpp/build/windows-msvc/bridge/cg_unity_bridge.dll'
          $destination = 'unity/Cubeglass/Assets/Plugins/win-x64'
          if (-not (Test-Path -LiteralPath $source)) {
            Write-Host "::error::The native bridge build did not produce $source."
            exit 1
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $destination 'cg_unity_bridge.dll') -Force
          Write-Host "Copied native bridge DLL: $source -> $destination"

      - name: Cache the Unity Library folder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: unity/Cubeglass/Library
          key: unity-library-standalonewindows64-${{ hashFiles('unity/Cubeglass/Packages/manifest.json', 'unity/Cubeglass/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-standalonewindows64-

      # --- Release gate: Unity EditMode and PlayMode tests -------------------
      # Install the pinned Unity CLI (the standalone binary) and the pinned
      # Editor, activate the licence from the UNITY_LICENSE offline .ulf or the
      # UNITY_SERIAL secret, and run the exact commands ci-local runs.
      # Any failure here fails the release before the player build.

      - name: Install the Unity CLI (pinned 1.0.0-beta.11)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'unity-cli-install.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.ps1' -OutFile $installer
          & powershell -NoProfile -ExecutionPolicy Bypass -File $installer -Target '1.0.0-beta.11'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Unity CLI install failed with exit code $LASTEXITCODE."
            exit 1
          }
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          if (-not (Test-Path -LiteralPath $unity)) {
            Write-Host "::error::Unity CLI executable not found at $unity after install."
            exit 1
          }
          & $unity --version

      - name: Install the pinned Unity Editor (6000.6.3f1)
        shell: pwsh
        run: |
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          & $unity install 6000.6.3f1 --non-interactive
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Unity Editor install failed with exit code $LASTEXITCODE."
            exit 1
          }

      - name: Install the Unity licensing client
        shell: pwsh
        run: |
          # `unity license activate` talks to the licensing client daemon; the
          # CLI manages that component itself, but a fresh runner has not
          # installed it yet (error: "Can't reach the Unity licensing client").
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          & $unity plugin install licensingClient
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Installing the managed Unity licensing client failed with exit code $LASTEXITCODE."
            exit 1
          }

      - name: Activate the Unity licence for the release gate
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          if (-not [string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {
            $license = Join-Path $env:RUNNER_TEMP 'Unity_lic.ulf'
            [System.IO.File]::WriteAllText($license, $env:UNITY_LICENSE)
            & $unity license activate --file $license --non-interactive
          }
          else {
            & $unity license activate --serial "$env:UNITY_SERIAL"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Unity licence activation failed with exit code $LASTEXITCODE."
            exit 1
          }

      - name: Run Unity EditMode and PlayMode tests (release gate)
        shell: pwsh
        run: |
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          $required = @{
            EditMode = @(
              'Cubeglass.Unity.Bridge.Tests.dll',
              'Cubeglass.Unity.Input.Tests.dll',
              'Cubeglass.Unity.Rendering.Tests.dll')
            PlayMode = @('Cubeglass.Unity.Rendering.PlayTests.dll')
          }
          foreach ($mode in @('EditMode', 'PlayMode')) {
            $results = Join-Path $env:RUNNER_TEMP ('cg-unity-{0}-results.xml' -f $mode.ToLowerInvariant())
            & $unity test unity/Cubeglass --mode $mode --non-interactive --output $results
            $testExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            & ./scripts/check-unity-results.ps1 -Mode $mode -ResultsPath $results -RequiredAssemblies $required[$mode] -TestExitCode $testExit
            if ($LASTEXITCODE -ne 0) {
              exit 1
            }
            $global:LASTEXITCODE = 0
          }

      - name: Build the Windows x64 player (pinned Unity CLI)
        shell: pwsh
        run: |
          # The same pinned CLI and activated licence as the release gate above;
          # no third-party action and no account credentials are involved.
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          & $unity run unity/Cubeglass --non-interactive -- -executeMethod Cubeglass.Editor.BuildPlayer.BuildWindows64
          $buildExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($buildExit -ne 0) {
            Write-Host "::error::unity run failed with exit code $buildExit."
            exit 1
          }
          $player = 'unity/Cubeglass/build/StandaloneWindows64/Cubeglass/Cubeglass.exe'
          if (-not (Test-Path -LiteralPath $player)) {
            Write-Host "::error::The Unity build produced no $player."
            exit 1
          }
          Write-Host "Player written: $player"

      - name: Package the player
        shell: pwsh
        run: |
          $player = 'unity/Cubeglass/build/StandaloneWindows64/Cubeglass'
          $zip = 'unity/Cubeglass/build/Cubeglass-windows-x64.zip'
          if (-not (Test-Path -LiteralPath $player)) {
            Write-Host "::error::The Unity build did not produce $player."
            exit 1
          }
          Compress-Archive -Path $player -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "$zip.sha256",
            ("{0}  {1}`n" -f $hash, (Split-Path -Leaf $zip)),
            [System.Text.UTF8Encoding]::new($false))
          Get-Item -LiteralPath $zip | Select-Object FullName, Length
          Get-Content -LiteralPath "$zip.sha256"

      - name: Upload the player artefact and its checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cubeglass-windows-x64
          path: |
            unity/Cubeglass/build/Cubeglass-windows-x64.zip
            unity/Cubeglass/build/Cubeglass-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Return the Unity licence seat (serial mode)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          # Serial activations are seats; return it even when the job failed or
          # was cancelled so ephemeral runners do not leak activations. The
          # offline .ulf mode has nothing to return, hence continue-on-error.
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          if (Test-Path -LiteralPath $unity) {
            & $unity license return --yes
            $global:LASTEXITCODE = 0
          }

  attach-hosted:
    name: Attach player (hosted)
    if: inputs.build_target == 'hosted'
    needs: windows-x64-player
    runs-on: windows-latest
    timeout-minutes: 15
    # The only writer on this route: write is scoped to this dependent job, so
    # the build job (and every one of its steps, including the unpinned Unity
    # CDN installer) runs read-only.
    permissions:
      contents: write
    steps:
      - name: Download the player artefact and its checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Cubeglass-windows-x64
          path: dist

      - name: Attach the player and its checksum to the v0.1.0 release when it exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing release is a normal outcome, not a step failure. Capture
          # the probe output and exit code explicitly and clear the native exit
          # state so the runner's appended `exit $LASTEXITCODE` check cannot
          # fail the first dispatch (I-1); pwsh 7.4+ may also turn a non-zero
          # native exit into a terminating error, so opt out for the probe.
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = gh release view v0.1.0 2>&1
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $releaseExists) {
            Write-Host ("v0.1.0 does not exist yet (probe output: {0}); the player stays available as the Cubeglass-windows-x64 workflow artefact (the tag is owner-gated per R50)." -f (($probe | Out-String).Trim()))
            exit 0
          }
          $upload = gh release upload v0.1.0 dist/Cubeglass-windows-x64.zip dist/Cubeglass-windows-x64.zip.sha256 --clobber 2>&1
          $uploadStatus = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($uploadStatus -ne 0) {
            Write-Host ($upload | Out-String)
            Write-Host "::error::gh release upload failed with exit code $uploadStatus."
            exit 1
          }
          Write-Host 'Attached Cubeglass-windows-x64.zip and Cubeglass-windows-x64.zip.sha256 to the v0.1.0 release.'

  build-self-hosted:
    name: Build player (self-hosted Windows)
    if: inputs.build_target == 'self-hosted'
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    # Read-only build, like the hosted route: write is scoped to the dependent
    # attach-self-hosted job so no build step can reach a repo-write token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner is a controlled machine that already has the pinned SDK, and
      # actions/setup-dotnet cannot install into C:\Program Files\dotnet without
      # elevation (it failed on the first self-hosted dispatch). Verify instead.
      - name: Verify the pinned .NET SDK (self-hosted)
        shell: powershell
        run: |
          $wanted = (Get-Content dotnet/global.json -Raw | ConvertFrom-Json).sdk.version
          $installed = @(& dotnet --list-sdks)
          if (-not ($installed | Where-Object { $_ -match ('^' + [regex]::Escape($wanted)) })) {
            Write-Host "::error::The self-hosted runner needs .NET SDK $wanted (dotnet/global.json); installed: $($installed -join '; '). Install it with winget or the official installer, then re-run."
            exit 1
          }
          Write-Host "dotnet SDK $wanted present."

      - name: Build the managed plugins (Release)
        shell: powershell
        run: dotnet build dotnet/Cubeglass.sln --configuration Release

      - name: Stage the managed plugins into the Unity project
        shell: powershell
        run: ./scripts/sync-unity-plugins.ps1

      # vcpkg resolution: prefer the machine's own checkout (VCPKG_ROOT or
      # %USERPROFILE%\vcpkg) and verify its HEAD against the baseline pinned in
      # cpp/vcpkg.json. A mismatch warns rather than fails: an ahead checkout
      # still builds (manifest versioning targets the baseline), while only a
      # checkout behind the baseline cannot resolve it, and that failure
      # surfaces loudly in the vcpkg install anyway. `vcpkg.exe` is
      # bootstrapped whenever the reused checkout lacks it. Without a reusable
      # checkout, clone the pinned baseline into the runner temp dir and
      # bootstrap. VCPKG_ROOT is written to GITHUB_ENV because the CMake
      # preset's toolchain file reads it from the environment; the installed
      # tree is kept next to the checkout, outside the workspace, so the
      # checkout action's clean cannot wipe it between runs.
      - name: Resolve vcpkg
        shell: powershell
        run: |
          $manifest = 'cpp/vcpkg.json'
          $baseline = (Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).'builtin-baseline'
          if ([string]::IsNullOrWhiteSpace($baseline)) {
            Write-Host "::error::$manifest declares no builtin-baseline; cannot verify the vcpkg checkout."
            exit 1
          }
          $candidates = @($env:VCPKG_ROOT, (Join-Path $env:USERPROFILE 'vcpkg'))
          $root = $candidates |
            Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ 'scripts\buildsystems\vcpkg.cmake')) } |
            Select-Object -First 1
          if ($root) {
            $head = (& git -C $root rev-parse HEAD | Out-String).Trim()
            if ($head -ne $baseline) {
              Write-Host "::warning::The reused vcpkg checkout at $root is at $head, but $manifest pins $baseline; proceeding (manifest versioning still targets the baseline). Update the checkout for a clean match."
            }
            else {
              Write-Host "Using the machine vcpkg at $root (HEAD $head matches the pinned baseline)."
            }
          }
          else {
            $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
            if (-not (Test-Path -LiteralPath (Join-Path $root 'scripts\buildsystems\vcpkg.cmake'))) {
              git clone https://github.com/microsoft/vcpkg.git $root
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::git clone of vcpkg failed with exit code $LASTEXITCODE."
                exit 1
              }
            }
            git -C $root checkout $baseline
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::vcpkg checkout $baseline failed with exit code $LASTEXITCODE."
              exit 1
            }
            Write-Host "Cloned vcpkg at the pinned baseline $baseline into $root."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'vcpkg.exe'))) {
            Write-Host "vcpkg.exe is missing at $root; bootstrapping."
            & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::vcpkg bootstrap failed with exit code $LASTEXITCODE."
              exit 1
            }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VCPKG_ROOT=$root`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VCPKG_INSTALLED_DIR=$root\installed`r`n")

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Toolchain versions
        shell: powershell
        run: |
          dotnet --version
          cmake --version
          ninja --version
          unity --version

      # Release, not the preset's Debug default: the player ships this DLL,
      # and a Debug build links the non-redistributable debug CRT, which would
      # fail to load on a machine without the Visual Studio debug runtimes.
      # cg_bridge is always part of the project (no build switch).
      - name: Configure the native bridge (Release)
        shell: powershell
        working-directory: cpp
        run: cmake --preset windows-msvc -DCMAKE_BUILD_TYPE=Release "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR"

      - name: Build the native bridge
        shell: powershell
        working-directory: cpp
        run: cmake --build --preset windows-msvc --target cg_bridge

      - name: Stage the native bridge into the Unity project
        shell: powershell
        run: |
          $source = 'cpp/build/windows-msvc/bridge/cg_unity_bridge.dll'
          $destination = 'unity/Cubeglass/Assets/Plugins/win-x64'
          if (-not (Test-Path -LiteralPath $source)) {
            Write-Host "::error::The native bridge build did not produce $source."
            exit 1
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $destination 'cg_unity_bridge.dll') -Force
          Write-Host "Copied native bridge DLL: $source -> $destination"

      # Same release gate as the hosted route: the EditMode and PlayMode suites
      # run before the player build and the shared scripts/check-unity-results.ps1
      # asserts the NUnit XML (non-zero total, zero failed, zero skipped and the
      # required assemblies present), so an exit-0 run that executed nothing
      # cannot pass the gate.
      - name: Run Unity EditMode and PlayMode tests (release gate)
        shell: powershell
        run: |
          $required = @{
            EditMode = @(
              'Cubeglass.Unity.Bridge.Tests.dll',
              'Cubeglass.Unity.Input.Tests.dll',
              'Cubeglass.Unity.Rendering.Tests.dll')
            PlayMode = @('Cubeglass.Unity.Rendering.PlayTests.dll')
          }
          foreach ($mode in @('EditMode', 'PlayMode')) {
            $results = Join-Path $env:TEMP ('cg-unity-{0}-results.xml' -f $mode.ToLowerInvariant())
            unity test unity/Cubeglass --mode $mode --non-interactive --output $results
            $testExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            & ./scripts/check-unity-results.ps1 -Mode $mode -ResultsPath $results -RequiredAssemblies $required[$mode] -TestExitCode $testExit
            if ($LASTEXITCODE -ne 0) {
              exit 1
            }
            $global:LASTEXITCODE = 0
          }

      # The machine's Hub activation is the licence: no secret, no `unity
      # license activate`, no editor install (the pinned 6000.6.3f1 editor is
      # already there). The build method exits non-zero on a failed build, and
      # the guard below catches a silent no-output run (for example an
      # unlicensed runner user) with the licence hint.
      - name: Build the Windows x64 player (self-hosted)
        shell: powershell
        run: |
          unity run unity/Cubeglass --non-interactive -- -executeMethod Cubeglass.Editor.BuildPlayer.BuildWindows64
          $buildExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($buildExit -ne 0) {
            Write-Host "::error::unity run failed with exit code $buildExit. Check that the runner's Windows user owns the Unity Hub activation (%LOCALAPPDATA%\Unity\licenses) and that Unity 6000.6.3f1 is installed, then re-run this job."
            exit 1
          }
          $player = 'unity/Cubeglass/build/StandaloneWindows64/Cubeglass/Cubeglass.exe'
          if (-not (Test-Path -LiteralPath $player)) {
            Write-Host "::error::The self-hosted build produced no $player. The runner's Windows user needs an activated Unity licence: open the Unity Hub on the runner, sign in and activate Unity Personal (Hub activation is per-user, under %LOCALAPPDATA%\Unity\licenses), then re-run this job."
            exit 1
          }
          Write-Host "Player present: $player"

      - name: Package the player
        shell: powershell
        run: |
          $player = 'unity/Cubeglass/build/StandaloneWindows64/Cubeglass'
          $zip = 'unity/Cubeglass/build/Cubeglass-v0.1.0-win-x64.zip'
          if (-not (Test-Path -LiteralPath (Join-Path $player 'Cubeglass.exe'))) {
            Write-Host "::error::The Unity build did not produce $player\Cubeglass.exe."
            exit 1
          }
          Compress-Archive -Path $player -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "$zip.sha256",
            ("{0}  {1}`n" -f $hash, (Split-Path -Leaf $zip)),
            [System.Text.UTF8Encoding]::new($false))
          Get-Item -LiteralPath $zip | Select-Object FullName, Length
          Get-Content -LiteralPath "$zip.sha256"

      - name: Upload the player artefact and its checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cubeglass-v0.1.0-win-x64
          path: |
            unity/Cubeglass/build/Cubeglass-v0.1.0-win-x64.zip
            unity/Cubeglass/build/Cubeglass-v0.1.0-win-x64.zip.sha256
          if-no-files-found: error

  attach-self-hosted:
    name: Attach player (self-hosted)
    if: inputs.build_target == 'self-hosted'
    needs: build-self-hosted
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    # The only writer on this route: write is scoped to this dependent job, so
    # the build job (and every one of its steps) runs read-only.
    permissions:
      contents: write
    steps:
      - name: Download the player artefact and its checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Cubeglass-v0.1.0-win-x64
          path: dist

      - name: Attach the player and its checksum to the v0.1.0 release when it exists
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release attach is optional runner tooling: without `gh` the
          # build still succeeds and the player stays available as the
          # workflow artefact, so skip with a warning instead of failing.
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::The GitHub CLI (gh) is not on PATH for this self-hosted runner; skipping the v0.1.0 attach. Install gh and re-run to publish the player to the release."
            exit 0
          }
          # A missing release is a normal outcome, not a step failure. Capture
          # the probe output and exit code explicitly and clear the native
          # exit state so the runner's appended `exit $LASTEXITCODE` check
          # cannot fail the first dispatch (I-1). The error preference is
          # relaxed around the probe because Windows PowerShell 5.1 turns a
          # redirected stderr line into a NativeCommandError under the
          # runner's `$ErrorActionPreference = 'Stop'`.
          $ErrorActionPreference = 'Continue'
          $probe = gh release view v0.1.0 2>&1
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $releaseExists) {
            Write-Host ("v0.1.0 does not exist yet (probe output: {0}); the player stays available as the Cubeglass-v0.1.0-win-x64 workflow artefact (the tag is owner-gated per R50)." -f (($probe | Out-String).Trim()))
            exit 0
          }
          $upload = gh release upload v0.1.0 dist/Cubeglass-v0.1.0-win-x64.zip dist/Cubeglass-v0.1.0-win-x64.zip.sha256 --clobber 2>&1
          $uploadStatus = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($uploadStatus -ne 0) {
            Write-Host ($upload | Out-String)
            Write-Host "::error::gh release upload failed with exit code $uploadStatus."
            exit 1
          }
          Write-Host 'Attached Cubeglass-v0.1.0-win-x64.zip and Cubeglass-v0.1.0-win-x64.zip.sha256 to the v0.1.0 release.'
