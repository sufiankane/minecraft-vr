name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench-cpp:
    name: bench-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Clone and bootstrap vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure benchmarks
        run: cmake --preset benchmarks
        working-directory: cpp

      - name: Build benchmarks
        run: cmake --build --preset benchmarks
        working-directory: cpp

      - name: Run benchmarks
        run: >-
          ./build/benchmarks/bin/cg_core_math_benchmarks
          --benchmark_out=benchmark_results.json
          --benchmark_out_format=json
        working-directory: cpp

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-cpp-results
          path: cpp/benchmark_results.json

  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Clone and bootstrap vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure tools (Release)
        run: cmake --preset linux-ci
        working-directory: cpp

      - name: Build tools (Release)
        run: cmake --build --preset linux-ci
        working-directory: cpp

      - name: Run glasses soak (30 minutes)
        run: |
          set -o pipefail
          ./build/linux-ci/bin/glasses_soak --minutes 30 2>&1 | tee soak.log
        working-directory: cpp

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-log
          path: cpp/soak.log

  bench-dotnet:
    name: bench-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Run CoreMath benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/CoreMath.Benchmarks/CoreMath.Benchmarks.csproj

      - name: Run Voxel benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Voxel.Benchmarks/Voxel.Benchmarks.csproj

      - name: Run Mesh benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Mesh.Benchmarks/Mesh.Benchmarks.csproj

      - name: Mesh p95 budget (8 ms shared-runner budget)
        # ADR-0007: p95 <= 2.0 ms on the dev/release machine. Shared GitHub
        # runners are noisier, so the CI gate uses 8 ms and still exits
        # non-zero when a shape exceeds it (see docs/perf/README.md).
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Mesh.Benchmarks/Mesh.Benchmarks.csproj
          -- p95 --budget-ms 8

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-dotnet-results
          path: dotnet/BenchmarkDotNet.Artifacts

  bench-compare:
    name: bench-compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [bench-cpp, bench-dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install -e python

      - name: Download C++ benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-cpp-results
          path: artifacts/cpp

      - name: Download .NET benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-dotnet-results
          path: artifacts/dotnet

      - name: Restore the nightly benchmark history
        # Self-seeding gate (TD-033/TD-054): the cache holds the up-to-five most
        # recent nightly summaries. No repository baseline file is involved, and
        # there is nothing to commit after a run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: nightly-bench-history-${{ github.run_id }}
          restore-keys: |
            nightly-bench-history-

      - name: Compare against the median of the last five nightly runs
        # TD-033/TD-034/TD-054: fail on a >10% regression against the median of
        # the previous up-to-five summaries, naming the benchmark. The first run
        # has no history: it bootstraps (passes, captures its measurements) so
        # the next run has something to compare against. The median absorbs one
        # noisy shared-runner night; the tolerance rationale is in
        # docs/perf/README.md. Two capture files keep a run from reading its own
        # cpp summary while comparing the dotnet one.
        run: |
          mkdir -p benchmark-history
          shopt -s nullglob
          bdn=(artifacts/dotnet/results/*.json)
          if [ ${#bdn[@]} -eq 0 ]; then
            echo "::error::no BenchmarkDotNet report JSON found under artifacts/dotnet/results; the .NET regression comparison did not run. The bench-dotnet job must upload BenchmarkDotNet.Artifacts/results/*.json."
            exit 1
          fi
          python -m depcheck benchregress \
            --history benchmark-history \
            --history-window 5 \
            --format google --prefix cpp \
            --current artifacts/cpp/benchmark_results.json \
            --capture "benchmark-history/bench-${{ github.run_id }}-cpp.json"
          python -m depcheck benchregress \
            --history benchmark-history \
            --history-window 5 \
            --format bdn --prefix dotnet \
            --current "${bdn[@]}" \
            --capture "benchmark-history/bench-${{ github.run_id }}-dotnet.json"

      - name: Upload the benchmark history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-bench-history
          path: benchmark-history

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install -e python

      - name: NuGet vulnerability scan (machine-readable)
        # TD-053: parse the JSON report instead of grepping for the human
        # marker text. `dotnet list package --format json` omits `frameworks`
        # for projects with no vulnerable packages; `depcheck nuget` handles
        # that and fails loudly on an unparseable report.
        run: |
          dotnet list dotnet/Cubeglass.sln package --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
          python -m depcheck nuget --report nuget-vulnerabilities.json

      - name: OSV-Scanner (pinned, advisory)
        # TD-053: pinned v2.6.0 scanning the hash-pinned Python requirement
        # files. OSV has no vcpkg extractor and the Unity UPM registry has no
        # open-source scanner; both residuals are documented in docs/ci.md.
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan
            -L
            python/requirements-ci.txt
            -L
            python/requirements-dev.txt

      - name: Python dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r python/requirements-dev.txt
          pip-audit -r python/requirements-ci.txt

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker mutation testing
        run: dotnet stryker --config-file stryker-config.json

  mutation-gameplay:
    name: mutation-gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker mutation testing (Gameplay)
        # TD-031: extend mutation coverage from Voxel to Cubeglass.Gameplay.
        # Project and thresholds are inline so dotnet/stryker-config.json stays
        # owned by the .NET workstream. The lane breaks below 70; the first
        # hosted run is expected to establish the actual score (see
        # docs/ci.md) and may need threshold tuning once it is recorded.
        run: >-
          dotnet stryker
          --project src/Gameplay/Cubeglass.Gameplay.csproj
          --break-at 70
          --threshold-high 90
          --reporter progress
          --reporter json
          --output mutation-gameplay

      - name: Upload the Gameplay mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-gameplay-report
          path: dotnet/mutation-gameplay
