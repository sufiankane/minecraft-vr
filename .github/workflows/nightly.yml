name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench-cpp:
    name: bench-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Clone and bootstrap vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure benchmarks
        run: cmake --preset benchmarks
        working-directory: cpp

      - name: Build benchmarks
        run: cmake --build --preset benchmarks
        working-directory: cpp

      - name: Run benchmarks
        run: >-
          ./build/benchmarks/bin/cg_core_math_benchmarks
          --benchmark_out=benchmark_results.json
          --benchmark_out_format=json
        working-directory: cpp

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-cpp-results
          path: cpp/benchmark_results.json

  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Clone and bootstrap vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout eb2d3a3279fd019cb7733072d86900d0ad2a1aef
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure tools (Release)
        run: cmake --preset linux-ci
        working-directory: cpp

      - name: Build tools (Release)
        run: cmake --build --preset linux-ci
        working-directory: cpp

      - name: Run glasses soak (30 minutes)
        run: |
          set -o pipefail
          ./build/linux-ci/bin/glasses_soak --minutes 30 2>&1 | tee soak.log
        working-directory: cpp

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-log
          path: cpp/soak.log

  bench-dotnet:
    name: bench-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Run CoreMath benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/CoreMath.Benchmarks/CoreMath.Benchmarks.csproj

      - name: Run Voxel benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Voxel.Benchmarks/Voxel.Benchmarks.csproj

      - name: Run Mesh benchmarks
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Mesh.Benchmarks/Mesh.Benchmarks.csproj

      - name: Mesh p95 budget (8 ms shared-runner budget)
        # ADR-0007: p95 <= 2.0 ms on the dev/release machine. Shared GitHub
        # runners are noisier, so the CI gate uses 8 ms and still exits
        # non-zero when a shape exceeds it (see docs/perf/README.md).
        run: >-
          dotnet run --configuration Release
          --project benchmarks/Mesh.Benchmarks/Mesh.Benchmarks.csproj
          -- p95 --budget-ms 8

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-dotnet-results
          path: dotnet/BenchmarkDotNet.Artifacts

  bench-compare:
    name: bench-compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [bench-cpp, bench-dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install -e python

      - name: Download C++ benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-cpp-results
          path: artifacts/cpp

      - name: Download .NET benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-dotnet-results
          path: artifacts/dotnet

      - name: Compare against the committed nightly baseline
        # Fails on >10% regression for any benchmark present in both the run
        # and docs/perf/nightly-baseline.json (dossier 9.9), naming the
        # offender. While the baseline is missing, the step still captures the
        # run as the nightly-baseline artefact to be committed, and the step
        # summary states explicitly that the comparison is not enforcing yet.
        # Zero .NET report files is a hard error, never a silent skip.
        run: |
          if [ ! -f docs/perf/nightly-baseline.json ]; then
            {
              echo "### Nightly benchmark gate"
              echo ""
              echo "No baseline is committed at \`docs/perf/nightly-baseline.json\`: **the regression comparison is NOT enforcing yet.**"
              echo ""
              echo "This run captured the measurements to the \`nightly-baseline\` artefact; commit that file (and re-run) to turn the gate on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m depcheck benchregress \
            --baseline docs/perf/nightly-baseline.json \
            --format google --prefix cpp \
            --current artifacts/cpp/benchmark_results.json \
            --capture artifacts/nightly-baseline.json
          shopt -s nullglob
          bdn=(artifacts/dotnet/results/*.json)
          if [ ${#bdn[@]} -eq 0 ]; then
            echo "::error::no BenchmarkDotNet report JSON found under artifacts/dotnet/results; the .NET regression comparison did not run. The bench-dotnet job must upload BenchmarkDotNet.Artifacts/results/*.json."
            exit 1
          fi
          python -m depcheck benchregress \
            --baseline docs/perf/nightly-baseline.json \
            --format bdn --prefix dotnet \
            --current "${bdn[@]}" \
            --capture artifacts/nightly-baseline.json

      - name: Upload captured baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-baseline
          path: artifacts/nightly-baseline.json

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: NuGet vulnerability scan (transitive included)
        run: |
          set +e
          output=$(dotnet list dotnet/Cubeglass.sln package --vulnerable --include-transitive 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::dotnet list package --vulnerable failed (exit $status); the scan did not run."
            exit 1
          fi
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::vulnerable NuGet package(s) found; update the pinned versions in dotnet/Directory.Packages.props."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Python dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r python/requirements-dev.txt
          pip-audit -r python/requirements-ci.txt

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker mutation testing
        run: dotnet stryker --config-file stryker-config.json
